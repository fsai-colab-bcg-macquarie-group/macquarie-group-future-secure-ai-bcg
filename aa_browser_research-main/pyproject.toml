[tool.poetry]
name            = "aa_browser_research"
version         = "0.1.0"
description     = "Advanced Analytics - Browser Agent Research."
authors         = ["Future Secure AI <support@futuresecure.ai>"]
license         = "MIT"
readme          = "README.md"

[tool.poetry.dependencies]
python                  = ">=3.11,<3.12"
fastapi                 = "0.115.1"
uvicorn                 = {extras=["standard"],version="0.34.2"}
browser-use             = { version="0.1.46", extras = ["memory", "patchright"] }
langchain_openai        = ">=0.3.1"
openai                  = "1.78.1"
celery                  = "5.3.6"
redis                   = "5.0.4"
aiofiles                = "24.1.0"
aiohttp                 = "3.11.16"
requests                = "2.32.3"
pandas                  = "2.2.3"
jinja2                  = "3.1.6"
scipy                   = "1.15.2"
human-eval              = "1.0.3"
playwright-recaptcha    = { git = "https://github.com/Xewdy444/Playwright-reCAPTCHA.git", rev = "v0.5.1" }
patchright              = ">1.5.0"
poetry-plugin-export    = "1.9.0"
streamlit               = "^1.34.0"

[tool.poetry.group.dev.dependencies]
pytest          = "^7.3.2"
pytest-asyncio  = "^0.18.3"

[[tool.poetry.packages]]
include = "api"

[[tool.poetry.packages]]
include = "aa_browser_research"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
