# This is a basic workflow to help you get started with Actions
name: Unit Test in Application

# Controls when the action will run. Invokes the workflow on push events but only for the main branch
on:
  pull_request:
    types: [opened]

# Permission can be added at job level or workflow level    
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  echelon-coverage-test:
    uses: Future-Secure-AI/cicd-templates/.github/workflows/coverage-test-backend.yaml@feature/coverage
    secrets: inherit
    with:
      VERSION_NODE: "20"
      ENVIRONMENT: "dev"

  SendMessageOnSuccess:
    needs: echelon-coverage-test
    if: success()
    uses: Future-Secure-AI/cicd-templates/.github/workflows/integration-roam.yaml@feature/coverage
    secrets: inherit
    with:
      message: "✅Tests in ${{ github.repository }}"
      team: "TEAM_AUTH_LAYER"

  SendMessageOnFailure:
    needs: echelon-coverage-test
    if: failure()
    uses: Future-Secure-AI/cicd-templates/.github/workflows/integration-roam.yaml@feature/coverage
    secrets: inherit
    with:
      message: "❌Tests in ${{ github.repository }}"
      team: "TEAM_AUTH_LAYER"
