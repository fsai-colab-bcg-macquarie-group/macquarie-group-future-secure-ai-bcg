
# This is a basic workflow to help you get started with Actions
name: CI Deployment to PROD

# Controls when the action will run. Invokes the workflow on push events but only for the main branch
on:
  push:
    tags:
      - 'v*'  

# Permission can be added at job level or workflow level    
permissions:
    id-token: write   # This is required for requesting the JWT
    contents: read    # This is required for actions/checkout
  
jobs:
    echelon-frontend-build:
      uses: Future-Secure-AI/cicd-templates/.github/workflows/docker-build.yaml@main
      secrets: inherit
      with:
        AWS_ACCOUNT: "340752804518"
        ENVIRONMENT: "prod"
    helm-deploy:
      needs: [echelon-frontend-build]
      uses: Future-Secure-AI/cicd-templates/.github/workflows/helm-deploy.yaml@main
      with:
        AWS_ACCOUNT: "340752804518"
        ENVIRONMENT: "prod"
        HELM_CHART_PATH: "./charts/echelon-frontend"
        NAMESPACE: "platform"
        HELM_RELEASE_NAME: "echelon-frontend"
        USE_IMAGE_OVERRIDE: true
        