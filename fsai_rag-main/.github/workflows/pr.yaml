name: Validate PR with tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
    id-token: write
    contents: read

jobs:
  run-tests:
    runs-on: self-hosted-dev
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Update package manager
        run: sudo apt-get update

      - name: Install required dependencies
        run: |
          sudo apt-get install -y sudo nano wget git-lfs libmagic1 zip gcc

      - name: Verify installations
        run: |
          git --version
          curl --version
          wget --version
          gcc --version


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install UV
        run: |
          pip install uv

      - name: Install dependencies
        run: |
          uv pip install -e . --system

      - name: Run the tests
        run: |
          pre-commit run --all-files
     # DISABLE until new database python -m pytest -n 4 .
